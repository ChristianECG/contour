<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-tl" cx="144" cy="0" r="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0aad2" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-br" cx="1056" cy="661" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6473a0" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="600" cy="280" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bec8f0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#bec8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#bg-tl)"/>
  <rect width="1200" height="630" fill="url(#bg-br)"/>
  <ellipse cx="600" cy="280" rx="460" ry="300" fill="url(#ambient)"/>

  <!--
    Logo geometry scaled 6× from viewBox (0 0 48 56):
      P0  = (6,42)  → offset(456,102) → (492, 354)
      CP1 = (6,10)  →                   (492, 162)
      CP2 = (42,44) →                   (708, 366)
      P3  = (42,14) →                   (708, 186)
    Stroke widths are kept flat (not scaled) to preserve the fine-line aesthetic.
  -->

  <!-- Handle lines -->
  <line x1="492" y1="354" x2="492" y2="162"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="708" y1="186" x2="708" y2="366"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Off-curve control points -->
  <circle cx="492" cy="162" r="5.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2"/>
  <circle cx="708" cy="366" r="5.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2"/>

  <!-- The bezier curve -->
  <path d="M 492,354 C 492,162 708,366 708,186"
        stroke="#ffffff" stroke-opacity="0.82" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- On-curve anchor points -->
  <circle cx="492" cy="354" r="7" fill="#ffffff" fill-opacity="0.82"/>
  <circle cx="708" cy="186" r="7" fill="#ffffff" fill-opacity="0.82"/>

  <!-- Brand -->
  <text x="600" y="472"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13"
        fill="#ffffff" fill-opacity="0.42"
        text-anchor="middle"
        letter-spacing="9">CONTOUR</text>
  <text x="600" y="500"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11"
        fill="#ffffff" fill-opacity="0.18"
        text-anchor="middle"
        letter-spacing="1.5">the geometry of type</text>
</svg>
